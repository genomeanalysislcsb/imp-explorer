[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imp-explorer"
version = "0.1.1"
description = "Interactive exploration of IMP3 (and optional sRNA-IMP) results"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
cohort = ["matplotlib", "scipy"]
app = ["dash>=2.17,<3", "dash-ag-grid>=31", "plotly>=5.22,<6", "duckdb>=1.0", "pyarrow>=14", "scipy"]

[project.scripts]
imp-explorer = "impexplorer.cli:main"

[tool.setuptools.packages.find]
include = ["impexplorer*"]
