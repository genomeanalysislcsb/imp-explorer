site_name: IMP explorer
site_url: https://genomeanalysislcsb.github.io/imp-explorer/
repo_url: https://github.com/genomeanalysislcsb/imp-explorer
repo_name: genomeanalysislcsb/imp-explorer
edit_uri: edit/main/docs/
site_description: Interactive exploration of IMP3 metagenomics and metatranscriptomics results
site_author: LCSB BioCore
copyright: LCSB BioCore, University of Luxembourg

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Export IMP3 results: export.md
      - Run the app: running.md
      - Cohort analysis: cohort.md
      - sRNA layer: srna.md
      - Metabolomics layer: metabolomics.md
  - The app: app.md
  - Reference:
      - Release tables (data model): data-model.md
      - IMP3 files read: imp3-files.md
      - Plug-ins and study portals: plugins.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
